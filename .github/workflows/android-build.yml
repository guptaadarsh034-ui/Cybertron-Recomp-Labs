name: Android ARM64 debug build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rexglue-host-toolchain:
    # ReXGlue is an optional research toolchain and is not required to package the Android diagnostic APK.
    # Keep its failures visible without allowing them to mark an otherwise valid APK build as failed.
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned host compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build
          cmake --version
          clang-18 --version
          cmake --version | head -n 1 | grep -E 'version 3\.(2[5-9]|[3-9][0-9])|version [4-9]\.' >/dev/null

      - name: Check out pinned ReXGlue SDK
        run: |
          git clone --depth 1 --branch v0.10.0 https://github.com/rexglue/rexglue-sdk.git thirdparty/rexglue-sdk
          git -C thirdparty/rexglue-sdk submodule update --init --recursive --depth 1

      - name: Configure ReXGlue host CLI
        run: |
          cmake -S thirdparty/rexglue-sdk -B out/build/rexglue-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_BUILD_TESTS=OFF \
            -DREXGLUE_ENABLE_DESKTOP_SDL_BACKENDS=OFF

      - name: Build ReXGlue host CLI
        run: cmake --build out/build/rexglue-host --target rexglue --parallel 2

      - name: Smoke-test ReXGlue CLI
        run: |
          test -x thirdparty/rexglue-sdk/out/linux-amd64/rexglue
          thirdparty/rexglue-sdk/out/linux-amd64/rexglue --help

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run host-native PowerPC core tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I android/app/src/main/cpp \
            android/app/src/main/cpp/ppc_core.cpp \
            tests/native/ppc_core_tests.cpp \
            -o /tmp/ppc_core_tests
          /tmp/ppc_core_tests

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK, and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Android ARM64 debug APK
        run: gradle -p android :app:assembleDebug --no-build-cache --rerun-tasks --stacktrace

      - name: Verify Android 16 and 16 KiB page-size packaging
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK_PATH"
          mkdir -p /tmp/cybertron-apk
          unzip -q "$APK_PATH" 'lib/arm64-v8a/*.so' -d /tmp/cybertron-apk
          SO_COUNT=$(find /tmp/cybertron-apk/lib/arm64-v8a -name '*.so' | wc -l)
          test "$SO_COUNT" -gt 0
          while IFS= read -r so; do
            echo "Checking 16 KiB ELF LOAD alignment: $so"
            readelf -lW "$so" | awk '$1 == "LOAD" && $NF ~ /^0x0*(4000|8000|10000)$/ { ok=1 } END { exit !ok }'
          done < <(find /tmp/cybertron-apk/lib/arm64-v8a -name '*.so')

      - name: Verify APK metadata and package versioned ZIP
        id: version
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="android/app/build.gradle.kts"
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' "$GRADLE_FILE")
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' "$GRADLE_FILE")
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          echo "$BADGING" | head -n 3

          echo "$BADGING" | grep -F "versionCode='$VERSION_CODE'" >/dev/null
          echo "$BADGING" | grep -F "versionName='$VERSION_NAME'" >/dev/null
          echo "$BADGING" | grep -F "package: name='com.cybertron.recomplabs'" >/dev/null
          echo "Verified APK metadata: versionName=$VERSION_NAME versionCode=$VERSION_CODE"

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp "$APK_PATH" "dist/cybertron-recomp-labs-v${VERSION_NAME}-android-arm64.apk"
          (cd dist && zip -j "cybertron-recomp-labs-v${VERSION_NAME}-android-arm64.zip" "cybertron-recomp-labs-v${VERSION_NAME}-android-arm64.apk")

      - name: Upload verified APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cybertron-recomp-labs-v${{ steps.version.outputs.name }}-android-arm64
          path: |
            dist/*.apk
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

name: Android ARM64 debug build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run host-native PowerPC core tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I android/app/src/main/cpp \
            android/app/src/main/cpp/ppc_core.cpp \
            tests/native/ppc_core_tests.cpp \
            -o /tmp/ppc_core_tests
          /tmp/ppc_core_tests

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK, and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android ARM64 debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Package versioned APK ZIP
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p dist
          cp "$APK_PATH" "dist/cybertron-recomp-labs-v${VERSION_NAME}-android-arm64.apk"
          (cd dist && zip -j "cybertron-recomp-labs-v${VERSION_NAME}-android-arm64.zip" "cybertron-recomp-labs-v${VERSION_NAME}-android-arm64.apk")

      - name: Upload versioned APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cybertron-recomp-labs-v${{ steps.version.outputs.name }}-android-arm64
          path: |
            dist/*.apk
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
